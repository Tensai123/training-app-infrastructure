name: Deploy Application with Ansible (Self-Hosted Runner)

on:
  workflow_run:
    workflows: ["Build and Push Docker Images to Docker Hub"]
    branches:
      - main
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Run Ansible Playbook
    runs-on: self-hosted
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify or install prerequisites (sshpass & ansible)
        run: |
          echo "Weryfikacja pakietu sshpass..."
          if ! command -v sshpass &> /dev/null; then
            echo "Instalacja sshpass..."
            sudo apt-get update && sudo apt-get install -y sshpass
          fi

          echo "Weryfikacja pakietu ansible-playbook..."
          if ! command -v ansible-playbook &> /dev/null; then
            echo "Instalacja ansible..."
            sudo apt-get update && sudo apt-get install -y ansible
          fi

      - name: Run Ansible Playbook on Target Server
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          ANSIBLE_USER: ${{ secrets.ANSIBLE_USER }}
          ANSIBLE_PASS: ${{ secrets.ANSIBLE_PASS }}
        run: |
          if [ -z "$APP_HOST" ]; then
            echo "BŁĄD: Zmienna repozytorium APP_HOST nie jest ustawiona!"
            exit 1
          fi

          echo "Rozpoczynam wdrożenie na serwer: $APP_HOST"
          cd ansible
          ansible-playbook -i "${APP_HOST}," deploy.yml \
            -e "ansible_user=${ANSIBLE_USER}" \
            -e "ansible_password=${ANSIBLE_PASS}" \
            -e "ansible_become_password=${ANSIBLE_PASS}" \
            -e "ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'"

      - name: Send Email Notification on Deployment Status
        if: always()
        env:
          SMTP_SERVER: ${{ vars.SMTP_SERVER || secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ vars.NOTIFICATION_EMAIL || secrets.NOTIFICATION_EMAIL }}
          APP_HOST: ${{ vars.APP_HOST }}
          WORKFLOW_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_REF: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'EOF'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          smtp_server = os.environ.get("SMTP_SERVER", "").strip()
          smtp_password = os.environ.get("SMTP_PASSWORD", "").strip()
          smtp_username = os.environ.get("SMTP_USERNAME", "").strip()
          recipient = os.environ.get("NOTIFICATION_EMAIL", "").strip()
          port_str = os.environ.get("SMTP_PORT", "587").strip()
          port = int(port_str) if port_str.isdigit() else 587

          # Jeśli zmienne nie są ustawione w repozytorium, bezpiecznie pomijamy krok
          if not smtp_server or not smtp_password or not recipient:
              print("Powiadomienie e-mail pominięte: brak wymaganych zmiennych (SMTP_SERVER, SMTP_PASSWORD, NOTIFICATION_EMAIL).")
              exit(0)

          status = os.environ.get("WORKFLOW_STATUS", "UNKNOWN")
          repo = os.environ.get("REPO_NAME", "")
          commit = os.environ.get("COMMIT_SHA", "")[:7]
          branch = os.environ.get("COMMIT_REF", "")
          host = os.environ.get("APP_HOST", "nieznany")
          actor = os.environ.get("ACTOR", "")
          run_id = os.environ.get("RUN_ID", "")
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          status_pl = "SUKCES" if status.lower() == "success" else "BŁĄD"
          status_emoji = "✅" if status.lower() == "success" else "❌"
          subject = f"[{status_emoji} {status_pl}] Wdrożenie Ansible: {repo} ({branch})"

          body = f"""Cześć,

Status wdrożenia aplikacji: {status_emoji} {status_pl} ({status})
Repozytorium: {repo}
Gałąź: {branch}
Commit: {commit}
Autor: {actor}
Serwer docelowy: {host}

Szczegóły przebiegu w GitHub Actions:
{run_url}

Wiadomość wygenerowana automatycznie przez pipeline CI/CD.
"""

          msg = MIMEMultipart()
          msg["From"] = smtp_username if "@" in smtp_username else f"{smtp_username}@{smtp_server}"
          msg["To"] = recipient
          msg["Subject"] = subject
          msg.attach(MIMEText(body, "plain", "utf-8"))

          try:
              print(f"Wysyłanie powiadomienia e-mail do: {recipient} przez {smtp_server}:{port}...")
              if port == 465:
                  with smtplib.SMTP_SSL(smtp_server, port, timeout=15) as server:
                      if smtp_username and smtp_password:
                          server.login(smtp_username, smtp_password)
                      server.send_message(msg)
              else:
                  with smtplib.SMTP(smtp_server, port, timeout=15) as server:
                      server.ehlo()
                      server.starttls()
                      server.ehlo()
                      if smtp_username and smtp_password:
                          server.login(smtp_username, smtp_password)
                      server.send_message(msg)
              print("Powiadomienie e-mail zostało wysłane pomyślnie.")
          except Exception as exc:
              print(f"Ostrzeżenie: Nie udało się wysłać powiadomienia e-mail: {exc}")
              # Błąd wysłania maila nie powinien powodować niepowodzenia całego wdrożenia
              exit(0)
          EOF
