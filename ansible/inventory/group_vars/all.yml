---
# Globalne zmienne konfiguracyjne dla wdrożenia aplikacji przez Ansible

# Użytkownik Docker Hub, z którego pobierane są obrazy
dockerhub_username: "tensai123"

# Tagi obrazów
api_image_tag: "latest"
worker_image_tag: "latest"
frontend_image_tag: "latest"

# Katalog instalacyjny na serwerze docelowym
app_dir: "/opt/training-app"

# Porty wystawione na serwerze
frontend_port: 80
api_port: 8000

# Konfiguracja środowiska aplikacji
app_env: "production"
database_url: "sqlite:////tmp/tasks.db"
redis_url: "redis://redis:6379/0"
task_queue_name: "tasks_queue"
