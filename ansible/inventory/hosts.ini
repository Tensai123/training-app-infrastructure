[app_servers]
# Tutaj podasz adres IP lub hostname swojego serwera docelowego
# Przykład: 
# app-server-1 ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
target-server ansible_host=YOUR_SERVER_IP ansible_user=ubuntu

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
